{% extends "base.html" %}{% block content %}<h1>Digital Menu</h1><div class="grid">{% for i in items %}<article><img src="{{i.image_url}}"><div class="pad"><small>{{i.category}}</small><h2>{{i.name}}</h2><p>{{i.description}}</p><small>{{i.ingredients}}</small><h2>₹{{i.price}}</h2>{% if i.available %}<input id="c{{i.item_id}}" placeholder="Customization (optional)"><button class="btn add" data-id="{{i.item_id}}" data-name="{{i.name}}" data-price="{{i.price}}">Add to Cart</button>{% else %}<b>Out of stock</b>{% endif %}</div></article>{% endfor %}</div>{% endblock %}
