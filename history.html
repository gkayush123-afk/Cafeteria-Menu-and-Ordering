{% extends "base.html" %}{% block content %}<h1>Order History</h1><form class="search"><input name="email" value="{{email}}" type="email" placeholder="Your email" required><button class="btn">Search</button></form>{% for o in orders %}<div class="row"><b>#{{o.order_id}}</b><span>{{o.status}} • {{o.slot_time}} • ₹{{o.total_amount}}</span></div>{% else %}<div class="card">Enter your email to see saved orders.</div>{% endfor %}{% endblock %}
