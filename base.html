<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaféGo — Smart Cafeteria Ordering & Pre-Order Service</title>
  <meta name="description" content="Order fresh cafeteria food, customize items, pre-order for scheduled pickup, and track your order in real-time.">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <nav>
    <a href="/" class="brand">
      <span>☕</span> CaféGo
    </a>
    <div class="nav-links">
      <a href="/menu">Digital Menu</a>
      <a href="/cart">
        Cart <span id="count" class="nav-badge" style="display:none;">0</span>
      </a>
      <a href="/history">Order History</a>
      <a href="/admin/login" class="btn-outline btn-sm">Admin Portal</a>
    </div>
  </nav>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          <span>🔔</span> {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer>
    <p><b>CaféGo</b> • Smart Campus Cafeteria Ordering & Food Pickup Service • Built for Efficiency</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
