{% extends "base.html" %}
{% block content %}
<div style="max-width: 440px; margin: 50px auto;">
  <div class="card" style="padding: 36px 28px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="font-size: 40px; margin-bottom: 8px;">🔐</div>
      <h2>Admin Operation Portal</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Kitchen staff & cafeteria management sign in</p>
    </div>

    <form method="post" action="/admin/login">
      <div style="margin-bottom: 14px;">
        <label style="font-size: 13px; font-weight: 600;">Username</label>
        <input type="text" name="username" value="admin" required autofocus>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600;">Password</label>
        <input type="password" name="password" value="admin123" required>
      </div>

      <button type="submit" class="btn btn-accent" style="width: 100%; padding: 14px; font-size: 15px;">
        Sign In to Dashboard →
      </button>
    </form>

    <div style="margin-top: 20px; background: #f8fafc; border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 10px; font-size: 12px; color: var(--text-muted); text-align: center;">
      Demo Access Credentials: <b>admin</b> / <b>admin123</b>
    </div>
  </div>
</div>
{% endblock %}
