{% extends "base.html" %}{% block content %}<h1>Checkout</h1><form class="card" method="post"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Pickup Time<select name="slot_id">{% for s in slots %}<option value="{{s.slot_id}}">{{s.slot_time}} ({{s.capacity-s.booked}} left)</option>{% endfor %}</select></label><label>Payment<select name="payment_method"><option>UPI</option><option>Card</option><option>Wallet</option><option>Cafeteria Credit</option></select></label><div id="summary"></div><button class="btn">Place Order & Pay</button></form>{% endblock %}
